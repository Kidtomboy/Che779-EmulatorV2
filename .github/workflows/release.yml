name: Phát hành

# Gắn thẻ dạng v1.3.1 (hoặc bấm chạy tay) để tự build trên Windows và đưa file tải về vào trang Releases.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build và đóng gói (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra thẻ khớp VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$v") { throw "Thẻ $env:GITHUB_REF_NAME không khớp VERSION (v$v)" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build bằng build_emulatorV2.ps1
        shell: pwsh
        working-directory: apps/emulator-v2/source
        run: ./build_emulatorV2.ps1
      - name: Đóng gói zip + SHA256SUMS (SHA tính SAU CÙNG trên đúng file zip)
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $n = "Che779-EmulatorV2-$ver-Windows"
          New-Item -ItemType Directory -Path "out/$n" -Force | Out-Null
          Copy-Item apps/emulator-v2/source/Che779_EmulatorV2.jar "out/$n/"
          Set-Content -Encoding ASCII "out/$n/chay.cmd" "@echo off`r`ncd /d `"%~dp0`"`r`nstart `"`" javaw -jar Che779_EmulatorV2.jar %*"
          @"
          Che779 Emulator V2 $ver (Windows)

          1. Cần Java 8 trở lên (https://adoptium.net).
          2. Bấm đúp chay.cmd.
          3. Muốn mở sẵn game: kéo file game .jar thả lên chay.cmd.

          Hướng dẫn đầy đủ: https://github.com/Kidtomboy/Che779-EmulatorV2
          "@ | Set-Content -Encoding UTF8 "out/$n/DOC-TOI-DAY.txt"
          Compress-Archive -Path "out/$n" -DestinationPath "out/$n.zip" -CompressionLevel Optimal
          Remove-Item "out/$n" -Recurse -Force
          $h = (Get-FileHash "out/$n.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $n.zip" | Set-Content -Encoding ASCII out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phat-hanh
          path: out/*
          if-no-files-found: error
      - name: Đưa lên trang Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## Che779 Emulator V2 ${{ github.ref_name }} — Windows
            Tải file `.zip`, giải nén rồi bấm đúp `chay.cmd`. Cần Java 8+.
            Kiểm tra file tải về bằng `SHA256SUMS.txt`: `Get-FileHash <file>.zip -Algorithm SHA256`. Chi tiết: `CHANGELOG.md`.
