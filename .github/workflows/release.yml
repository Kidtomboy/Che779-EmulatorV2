name: Phát hành

# Gắn thẻ dạng v1.2.0 (hoặc bấm chạy tay) để tự build và đưa file tải về vào trang Releases.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Build và kiểm thử
        run: bash tests/run-tests.sh
      - name: Đóng gói
        run: |
          VER=$(cat VERSION)
          N="Che779-EmulatorV2-$VER"
          mkdir -p out "$N"
          cp apps/emulator-v2/source/Che779_EmulatorV2.jar "$N/"
          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" javaw -jar Che779_EmulatorV2.jar %%*\r\n' > "$N/chay.cmd"
          printf '#!/usr/bin/env bash\ncd "$(dirname "$0")"\nexec java -jar Che779_EmulatorV2.jar "$@"\n' > "$N/chay.sh"
          chmod +x "$N/chay.sh"
          cat > "$N/DOC-TOI-DAY.txt" <<EOF
          Che779 Emulator V2 $VER

          1. Cần Java 8 trở lên (Windows: https://adoptium.net ; Debian/Ubuntu/Mint: sudo apt install default-jre).
          2. Windows: bấm đúp chay.cmd.  Linux: ./chay.sh
          3. Muốn mở sẵn game: kéo file game .jar thả lên chay.cmd, hoặc ./chay.sh /duong/dan/game.jar

          Hướng dẫn đầy đủ: https://github.com/Kidtomboy/Che779-EmulatorV2
          EOF
          zip -qr "out/$N.zip" "$N"
      - name: Tạo SHA256SUMS (làm SAU CÙNG, trên đúng file sẽ phát hành)
        run: |
          cd out
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phat-hanh
          path: out/*
      - name: Đưa lên trang Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## Che779 Emulator V2 ${{ github.ref_name }}
            Tải file `.zip`, giải nén rồi chạy `chay.cmd` (Windows) hoặc `chay.sh` (Linux). Cần Java 8+.
            Kiểm tra file tải về bằng `SHA256SUMS.txt`. Chi tiết: xem `CHANGELOG.md`.
