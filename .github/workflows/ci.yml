name: Project 2 CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and test
        run: bash tests/run-tests.sh
      - name: Upload emulator JAR
        uses: actions/upload-artifact@v4
        with:
          name: Che779-EmulatorV2
          path: Che779_EmulatorV2.jar
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build with CMD
        working-directory: emulator-src
        shell: cmd
        run: build_emulatorV2.cmd
