name: Kiểm tra (CI)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Kiểm thử (build helper + test, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: bash tests/run-tests.sh

  windows:
    name: Build bằng CMD và PowerShell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build bằng CMD
        working-directory: apps/emulator-v2/source
        shell: cmd
        run: build_emulatorV2.cmd
      - name: Build bằng PowerShell
        working-directory: apps/emulator-v2/source
        shell: pwsh
        run: ./build_emulatorV2.ps1

  nhat-ky-build:
    name: Nhật ký build
    if: always() && github.event_name != 'pull_request'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: buildlog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Đăng nhật ký build lên Release "buildlog"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-buildlog.sh buildlog "Nhật ký build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_id }}
          path: build-tail.log
          if-no-files-found: ignore
          retention-days: 14
