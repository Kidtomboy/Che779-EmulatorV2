name: Kiểm tra (CI)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build và kiểm thử (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: bash tests/run-tests.sh

  windows:
    name: Build bằng CMD và PowerShell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build bằng CMD
        working-directory: apps/emulator-v2/source
        shell: cmd
        run: build_emulatorV2.cmd
      - name: Build bằng PowerShell
        working-directory: apps/emulator-v2/source
        shell: pwsh
        run: ./build_emulatorV2.ps1
